<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Absen Kehadiran Tim - EHA TP Serang DC</title>
<style>
:root{--bg:#060913;--card:#0d1428;--text:#e6f0ff;--muted:#8fa3c7;--line:rgba(56,189,248,.22);--cyan:#22d3ee;--pink:#ff2bd6;--green:#39ff88;--amber:#ffb800;--grad:linear-gradient(120deg,#22d3ee,#a855f7 55%,#ff2bd6)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text);
  background:radial-gradient(700px 420px at 90% -10%,rgba(168,85,247,.22),transparent 62%),radial-gradient(640px 400px at -10% 110%,rgba(34,211,238,.18),transparent 60%),var(--bg)}
.kartu{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:0 0 50px -12px rgba(34,211,238,.5),0 20px 40px -10px rgba(0,0,0,.7)}
.logo{text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{text-align:center;font-size:23px;margin:6px 0 4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(34,211,238,.45))}
.shift{text-align:center;font-size:13px;color:var(--muted);margin-bottom:22px;min-height:18px}
label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
select,input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(6,9,19,.8);color:var(--text);font-size:16px;outline:none}
select:focus,input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
option{background:#0a1022;color:var(--text)}
button{width:100%;margin-top:22px;padding:16px;border:none;border-radius:12px;background:var(--grad);color:#060913;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 0 22px -4px rgba(34,211,238,.85)}
button:disabled{opacity:.55;cursor:not-allowed}
.hasil{margin-top:18px;border-radius:12px;padding:14px;font-size:14px;line-height:1.5;display:none}
.hasil.tampil{display:block}
.hasil.ok{background:rgba(57,255,136,.1);border:1px solid rgba(57,255,136,.5);color:var(--green)}
.hasil.info{background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.5);color:var(--amber)}
.hasil.err{background:rgba(255,43,214,.1);border:1px solid rgba(255,43,214,.5);color:#ff7ae8}
.hasil strong{display:block;font-size:16px;margin-bottom:2px}
.catatan{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.55;text-align:center}
</style>
</head>
<body>
<main class="kartu">
    <div class="logo">EHA TP Serang DC</div>
    <h1>Absen Kehadiran Tim</h1>
    <div class="shift" id="info-shift">Memuat daftar nama...</div>

    <label for="kelompok">Kelompok</label>
    <select id="kelompok"></select>

    <label for="nama">Nama</label>
    <select id="nama"></select>

    <label for="status">Status</label>
    <select id="status">
        <option value="H">Hadir</option>
        <option value="S">Sakit</option>
        <option value="I">Izin / Cuti</option>
    </select>

    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="PIN dari leader">

    <button id="btn" type="button">Absen Hadir</button>
    <div class="hasil" id="hasil" role="status" aria-live="polite"></div>

    <p class="catatan">Absen hanya untuk diri sendiri. PIN bersifat pribadi, jangan dibagikan.<br>Absen sebelum pukul 08.00 dihitung untuk shift tanggal sebelumnya.<br>Sakit atau Izin / Cuti dicatat untuk shift tanggal yang tertera di atas.</p>
</main>

<script>
/* Alamat Web App (/exec) project Google pribadi untuk absen. */
const ABSEN_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxCVXCo-COicHN0nPeLKR2iMgGGYuKNeacLtWVQM1pUJJwmCV9PGWsVDOVsbDCb9wfx7A/exec';

const $ = id => document.getElementById(id);
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const STATUS = { H: 'Hadir', A: 'Alpa', S: 'Sakit', I: 'Izin / Cuti' };
const LABEL_TOMBOL = { H: 'Absen Hadir', S: 'Kirim: Sakit', I: 'Kirim: Izin / Cuti' };
let daftar = null;

function tglIndo(label) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(label || '');
    return m ? parseInt(m[3], 10) + ' ' + BULAN[parseInt(m[2], 10) - 1] + ' ' + m[1] : (label || '-');
}

function tampil(html, jenis) {
    const el = $('hasil');
    el.className = 'hasil' + (html ? ' tampil ' + jenis : '');
    el.innerHTML = '';
    if (!html) return;
    (Array.isArray(html) ? html : [html]).forEach(function (baris, i) {
        const n = document.createElement(i === 0 ? 'strong' : 'div');
        n.textContent = baris;
        el.appendChild(n);
    });
}

function pesanError(res) {
    return String((res && res.error) || 'Respons tidak valid dari server.').replace(/^Error:\s*/, '');
}

/* Panggilan ke Web App lewat tag script (JSONP), dengan batas waktu */
function panggil(params, sukses, gagal) {
    const nama = 'cb_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const sc = document.createElement('script');
    let selesai = false, timer = null;
    const bersih = function () { selesai = true; clearTimeout(timer); delete window[nama]; sc.remove(); };

    window[nama] = function (res) { if (selesai) return; bersih(); sukses(res); };
    sc.onerror = function () { if (selesai) return; bersih(); gagal('Tidak dapat terhubung ke server. Periksa koneksi internet atau akses Web App.'); };
    timer = setTimeout(function () { if (selesai) return; bersih(); gagal('Server tidak merespons. Coba lagi.'); }, 20000);

    const q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); });
    q.push('callback=' + nama, '_=' + Date.now());
    sc.src = ABSEN_WEBAPP_URL + '?' + q.join('&');
    document.body.appendChild(sc);
}

function isiKelompok() {
    const sel = $('kelompok');
    sel.innerHTML = '';
    daftar.kelompok.forEach(function (k) {
        const o = document.createElement('option');
        o.value = k.nama;
        o.textContent = k.nama;
        sel.appendChild(o);
    });
    let simpan = '';
    try { simpan = localStorage.getItem('absen_kelompok') || ''; } catch (e) { /* abaikan */ }
    if (daftar.kelompok.some(function (k) { return k.nama === simpan; })) sel.value = simpan;
    isiNama();
}

function isiNama() {
    const kel = daftar.kelompok.find(function (k) { return k.nama === $('kelompok').value; });
    const sel = $('nama');
    sel.innerHTML = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '- pilih nama -';
    sel.appendChild(placeholder);
    (kel ? kel.orang.slice() : []).sort(function (a, b) { return a.nama.localeCompare(b.nama); }).forEach(function (o) {
        const opt = document.createElement('option');
        opt.value = o.nama;
        opt.textContent = o.nama + (o.team ? ' · ' + o.team : '');
        sel.appendChild(opt);
    });
    let simpan = '';
    try { simpan = localStorage.getItem('absen_nama') || ''; } catch (e) { /* abaikan */ }
    if (kel && kel.orang.some(function (o) { return o.nama === simpan; })) sel.value = simpan;
}

function muatDaftar() {
    $('btn').disabled = true;
    panggil({ type: 'absen_daftar' }, function (res) {
        if (!res || !res.success || !res.data) {
            $('info-shift').textContent = 'Daftar nama gagal dimuat.';
            tampil(pesanError(res), 'err');
            return;
        }
        daftar = res.data;
        $('info-shift').textContent = 'Shift tanggal ' + tglIndo(daftar.tanggalShift) + ' · pukul ' + daftar.jam + ' WIB';
        isiKelompok();
        $('btn').disabled = false;
    }, function (msg) {
        $('info-shift').textContent = 'Daftar nama gagal dimuat.';
        tampil(msg, 'err');
    });
}

function absen() {
    const kelompok = $('kelompok').value, nama = $('nama').value, pin = $('pin').value.trim(), status = $('status').value;
    if (!nama) { tampil('Pilih nama Anda dulu.', 'err'); return; }
    if (!pin) { tampil('Masukkan PIN.', 'err'); return; }

    try { localStorage.setItem('absen_kelompok', kelompok); localStorage.setItem('absen_nama', nama); } catch (e) { /* abaikan */ }
    $('btn').disabled = true;
    tampil('Mengirim...', 'info');

    panggil({ type: 'absen_simpan', kelompok: kelompok, nama: nama, pin: pin, status: status, ua: navigator.userAgent.slice(0, 120) }, function (res) {
        $('btn').disabled = false;
        $('pin').value = '';
        if (!res || !res.success || !res.data) { tampil('Gagal: ' + pesanError(res), 'err'); return; }
        const d = res.data, st = d.status || 'H';
        if (!d.sudah) {
            const judul = d.diperbarui ? 'Status diperbarui: ' + STATUS[st] : (st === 'H' ? 'Absen tercatat' : STATUS[st] + ' tercatat');
            tampil([judul, d.nama + (d.team ? ' (' + d.team + ')' : ''), 'Shift ' + tglIndo(d.tanggal) + ' · pukul ' + String(d.jam).slice(0, 5) + ' WIB'], 'ok');
        } else if (d.sumber === 'sheet') {
            tampil(['Sudah tercatat', 'Kehadiran ' + tglIndo(d.tanggal) + ' sudah diisi leader: ' + (STATUS[d.status] || d.status) + '.'], 'info');
        } else {
            tampil(['Sudah tercatat: ' + STATUS[st], d.nama + ' · shift ' + tglIndo(d.tanggal) + ' pukul ' + String(d.jam).slice(0, 5) + ' WIB'], 'info');
        }
    }, function (msg) {
        $('btn').disabled = false;
        tampil('Gagal: ' + msg, 'err');
    });
}

$('kelompok').addEventListener('change', function () { try { localStorage.removeItem('absen_nama'); } catch (e) { /* abaikan */ } isiNama(); });
$('status').addEventListener('change', function () { $('btn').textContent = LABEL_TOMBOL[$('status').value]; tampil('', ''); });
$('btn').addEventListener('click', absen);
$('pin').addEventListener('keypress', function (e) { if (e.key === 'Enter') absen(); });
muatDaftar();
</script>
</body>
</html>
